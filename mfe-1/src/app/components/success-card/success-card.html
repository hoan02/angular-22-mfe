<div hlmCard class="p-8 md:p-12 border-2 border-slate-800 text-center space-y-6 max-w-2xl mx-auto shadow-2xl font-sans">
  
  <div class="w-20 h-20 bg-emerald-500/10 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto shadow-lg border-2 border-emerald-500/20">
    <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width: 40px; height: 40px; flex-shrink: 0;">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
  </div>
  
  <div hlmCardHeader class="space-y-2 p-0">
    <h3 hlmCardTitle class="text-3xl font-bold text-white tracking-tight">Gửi Hồ sơ Thành công</h3>
    <p hlmCardDescription class="text-slate-400 text-xs max-w-md mx-auto leading-relaxed">
      Hồ sơ khai phá vũ trụ của bạn đã được kiểm duyệt, ký điện tử bảo mật và truyền tải thành công lên hệ thống dữ liệu quỹ đạo.
    </p>
  </div>
  
  <div hlmCardContent class="bg-[#020617] p-5 rounded-xl text-left border-2 border-slate-900 font-mono text-[11px] overflow-auto max-h-60 max-w-md mx-auto text-emerald-400 shadow-inner">
    <pre>{{ service.submissionData() | json }}</pre>
  </div>

  <div hlmCardFooter class="flex justify-center p-0">
    <button hlmBtn type="button" (click)="service.resetForm()" 
            class="px-6 py-5 font-mono font-bold text-xs bg-emerald-500 hover:bg-emerald-600 text-slate-950 transition-all duration-200 cursor-pointer shadow-md hover:shadow-emerald-500/20 transform hover:-translate-y-0.5">
      Gửi Hồ sơ mới
    </button>
  </div>
</div>
